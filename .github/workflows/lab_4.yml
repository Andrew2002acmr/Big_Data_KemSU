name: Лабораторная работа 4

on:
  push:
    branches: [lab_4]
  pull_request:
    branches: [lab_4]

permissions:
  contents: read

defaults:
  run:
    working-directory: lab_4

env:
  DO_NOT_TRACK: '1'
  FEAST_TELEMETRY: 'False'
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lab_4/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
