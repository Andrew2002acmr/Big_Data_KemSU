x-flink: &flink
  image: lab5-flink:1
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.bind-address: 0.0.0.0
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 1536m
      taskmanager.numberOfTaskSlots: 4
      parallelism.default: 2
      env.java.opts.taskmanager: -XX:+UseZGC -XX:ActiveProcessorCount=4
  volumes:
    - flink-state:/checkpoints

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: '-Xms512m -Xmx512m'
      KAFKA_JVM_PERFORMANCE_OPTS: '-server -XX:+UseZGC -XX:ActiveProcessorCount=3'
    ports: ['127.0.0.1:19092:19092']
    volumes: ['kafka-data:/var/lib/kafka/data']
    healthcheck:
      test: ['CMD', 'bash', '-ec', '</dev/tcp/127.0.0.1/9092']
      interval: 5s
      timeout: 5s
      retries: 24

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ['/bin/bash', '-ec']
    command:
      - |
        for topic in hospital-events spark-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 2 --replication-factor 1
        done

  redis:
    image: redis:7.4.2-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes: ['redis-data:/data']
    ports: ['127.0.0.1:16379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15

  jobmanager:
    <<: *flink
    build: {context: ., target: flink-job}
    command: ['standalone-job', '--job-classname', 'lab5.StreamJob']
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ['127.0.0.1:18081:8081']

  taskmanager:
    <<: *flink
    pull_policy: never
    command: ['taskmanager']
    depends_on: [jobmanager]

  model-server:
    image: lab5-app:1
    build: {context: ., target: app}
    command: ['uvicorn', 'model_server:app', '--host', '0.0.0.0', '--port', '8000']
    ports: ['127.0.0.1:18000:8000']

  pushgateway:
    image: prom/pushgateway:v1.11.1

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ['./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro', './monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro']
    ports: ['127.0.0.1:19090:9090']
    depends_on: [pushgateway]

  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/streaming.json:/var/lib/grafana/dashboards/streaming.json:ro
    ports: ['127.0.0.1:13000:3000']
    depends_on: [prometheus]

  monitor:
    image: lab5-app:1
    pull_policy: never
    command: ['python', 'monitor.py']
    depends_on: [jobmanager, model-server, pushgateway]

  bench:
    image: lab5-app:1
    pull_policy: never
    command: ['python', 'benchmark.py', '--engine', 'flink']
    depends_on: [taskmanager, model-server, pushgateway]
    volumes: ['./tmp/results:/results']

  spark:
    profiles: [spark]
    image: lab5-spark:1
    build: {context: ., target: spark-job}
    command: ['spark-submit', '--master', 'local[2]', '--driver-memory', '1g', '--jars', '/opt/kafka-jars/spark-sql-kafka-0-10_2.12-3.5.7.jar,/opt/kafka-jars/spark-token-provider-kafka-0-10_2.12-3.5.7.jar,/opt/kafka-jars/kafka-clients-3.4.1.jar,/opt/kafka-jars/commons-pool2-2.11.1.jar', '/app/spark_job.py']
    restart: on-failure:3
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes: ['spark-state:/state']
    ports: ['127.0.0.1:14040:4040']

volumes:
  kafka-data:
  redis-data:
  flink-state:
  spark-state:
