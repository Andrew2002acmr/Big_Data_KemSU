apiVersion: v1
kind: ServiceAccount
metadata: {name: lab6-viewer}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: lab6-viewer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: ServiceAccount, name: lab6-viewer, namespace: lab6}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: lab6-viewer}
rules:
  - apiGroups: ['']
    resources: [namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: lab6-viewer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: lab6-viewer}
subjects: [{kind: ServiceAccount, name: lab6-viewer, namespace: lab6}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: headlamp}
spec:
  replicas: 1
  selector: {matchLabels: {app: headlamp}}
  template:
    metadata: {labels: {app: headlamp}}
    spec:
      nodeSelector: {lab6-store: 'true'}
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.34.0
          args: [-in-cluster]
          ports: [{name: http, containerPort: 4466}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 3}
          resources: {requests: {cpu: 25m, memory: 48Mi}, limits: {cpu: 250m, memory: 192Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: headlamp}
spec:
  type: NodePort
  selector: {app: headlamp}
  ports: [{name: http, port: 4466, targetPort: http, nodePort: 30063}]
