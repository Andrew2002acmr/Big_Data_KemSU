apiVersion: v1
kind: ServiceAccount
metadata: {name: lab6-prometheus}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: lab6-prometheus}
rules:
  - {apiGroups: [''], resources: [nodes, nodes/proxy, pods], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: lab6-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: lab6-prometheus}
subjects: [{kind: ServiceAccount, name: lab6-prometheus, namespace: lab6}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{port: 9090, nodePort: 30061}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: lab6-prometheus
      nodeSelector: {lab6-store: 'true'}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2h]
          ports: [{containerPort: 9090}]
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 320Mi}}
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: pushgateway}
spec:
  selector: {app: pushgateway}
  ports: [{port: 9091}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pushgateway}
spec:
  selector: {matchLabels: {app: pushgateway}}
  template:
    metadata: {labels: {app: pushgateway}}
    spec:
      nodeSelector: {lab6-store: 'true'}
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.1
          resources: {requests: {cpu: 20m, memory: 24Mi}, limits: {cpu: 200m, memory: 96Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, nodePort: 30060}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      nodeSelector: {lab6-store: 'true'}
      containers:
        - name: grafana
          image: grafana/grafana:11.6.1
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'true'}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: 'true'}
          ports: [{containerPort: 3000}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 320Mi}}
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/lab6.yml, subPath: datasource.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/lab6.yml, subPath: dashboards.yml}
            - {name: config, mountPath: /var/lib/grafana/dashboards/lab6.json, subPath: lab6.json}
      volumes: [{name: config, configMap: {name: grafana-config}}]
